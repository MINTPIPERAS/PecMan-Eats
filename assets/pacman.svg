<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" shape-rendering="crispEdges">
    <defs>
        <mask id="pacmanMask">
            <circle cx="100" cy="100" r="80" fill="white" />
            <polygon points="100,100 180,90 180,110" fill="black">
                <animate attributeName="points"
                    values="100,100 180,90 180,110; 100,100 180,30 180,170; 100,100 180,90 180,110"
                    dur="0.6s" repeatCount="indefinite" />
            </polygon>
        </mask>
    </defs>

    <g>
        <animateTransform attributeName="transform" type="rotate" values="0 100 100; 3 100 100; 0 100 100; -3 100 100; 0 100 100" dur="1.2s" repeatCount="indefinite" />

        <g mask="url(#pacmanMask)">
            <circle cx="100" cy="100" r="80" fill="#FECB40" />

            <rect x="20" y="80" width="6" height="40" fill="#FCA930" />
            <rect x="21" y="70" width="5" height="10" fill="#FCA930" />
            <rect x="21" y="120" width="5" height="10" fill="#FCA930" />

            <rect x="175" y="40" width="5" height="15" fill="#FCA930" />
            <rect x="175" y="145" width="5" height="15" fill="#FCA930" />

            <rect x="90" y="20" width="20" height="5" fill="#FCA930" />
            <rect x="90" y="175" width="20" height="5" fill="#FCA930" />

            <rect x="90" y="58" width="14" height="14" rx="2" fill="#2E2E2E" />
        </g>
    </g>
</svg>
